schema_version: 2
selected_concept:
  id: A
  name: 秋日城市温度同行
design_intent: 把 NORI 保温杯表现为秋季城市通勤中的可靠随行装备，让用户先感知商品与“温度随行”的关系，再快速理解功能、价格和活动时间。
visual_priority:
  - 商品身份与完整轮廓
  - 主标题与秋季通勤叙事
  - 活动价格
  - 三项核心卖点
  - 品牌、活动时间与 CTA
scene_direction: 使用现代城市通勤语境与克制秋季线索建立代入感；环境只负责解释使用情境，不与商品竞争。
product_treatment: 商品必须成为绝对视觉主角，并保持原始轮廓、主要配色、两段式杯盖、环形手柄和杯身双叶标识准确；它承担“可靠随行装备”的叙事角色。
selling_point_expression: 将 316 内胆、12 小时保温保冷和防漏锁扣转化为易扫描、与商品或使用情境相关的视觉说明；形式可变化，但不得退化为三行普通正文或虚构内部结构。
mood_and_light: 温暖、清爽、自然且可信；光线应强化商品轮廓和表面质感，并保留真实主要颜色。
composition_direction: 建立从商品与主标题进入价格和卖点、再到活动时间与 CTA 的清晰阅读路径；允许 ImageGen 根据画面平衡自由组织精确位置与尺度。
brand_expression: 以克制、有呼吸感和可靠的视觉关系表达 NORI；Logo 保持原几何、比例、方向与颜色。
cta_direction: CTA 应清楚可见并延续品牌气质，但保持低于商品、标题与价格的层级。
avoid:
  - 改变商品结构、主要颜色或商品自带标识
  - 重绘、拉伸、旋转或替换品牌 Logo
  - 过度季节装饰、廉价促销贴纸和无关道具堆砌
  - 虚构内部结构或未在 brief 中出现的功能
  - 乱码、重复文案、中英文混用或遗漏锁定文案
composition_freedom: high

